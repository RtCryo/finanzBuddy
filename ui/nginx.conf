server {
    listen 80;
    server_name _;
    client_max_body_size 15m;
    root /usr/share/nginx/html;
    index index.html;

    # Send relative Location headers: behind a mapped port or the TLS-terminating Traefik,
    # nginx only knows its own port 80 and plain http and would redirect there.
    absolute_redirect off;

    location = /api {
        return 308 /api/;
    }

    # Keep every /api/auth variant at authBuddy; the gateway has no /auth handlers.
    location = /api/auth {
        return 308 /api/auth/;
    }

    # Resolve authBuddy lazily so the UI still starts (and shows a clear sign-in error) while it is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/auth/ {
        set $auth_upstream http://auth:8080;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The gateway permits /actuator/prometheus for the central Prometheus, which reaches it over
    # finanzbuddy-metrics. Browsers must never see it through this proxy (root capability
    # homebuddy-monitoring), and nginx normalizes /api/auth/../actuator/... to this prefix.
    location ~* ^/api/actuator {
        return 404;
    }

    location /api/ {
        client_max_body_size 15m;
        proxy_pass http://api-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
