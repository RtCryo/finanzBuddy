spring:
  application:
    name: parser-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finanzbuddy}
    username: ${DB_USER:finanzbuddy}
    password: ${DB_PASSWORD:finanzbuddy}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
    show-sql: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: parser-service
      auto-offset-reset: earliest

parser:
  formats:
    csv: ${PARSER_FORMAT_CSV:true}
    pdf: ${PARSER_FORMAT_PDF:false}
    xml: ${PARSER_FORMAT_XML:false}
    csv-charset: ${PARSER_FORMAT_CSV_CHARSET:windows-1252}
    csv-separator: ${PARSER_FORMAT_CSV_SEPARATOR:;}
    csv-max-rows: ${PARSER_FORMAT_CSV_MAX_ROWS:100000}
    csv-locale: ${PARSER_FORMAT_CSV_LOCALE:de-DE}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:finanzbuddy-documents}
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
    internal-api-key: ${INTERNAL_API_KEY:}
    connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:5s}
    read-timeout: ${GATEWAY_READ_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
  health:
    defaults:
      enabled: true

logging:
  level:
    com.finanzbuddy.parser: INFO
