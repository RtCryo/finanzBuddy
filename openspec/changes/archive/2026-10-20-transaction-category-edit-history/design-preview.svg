  <text x="306" y="611" class="body regular">11 Mar 2024</text>
  <text x="444" y="604" class="ink regular" font-weight="600">Northside Pharmacy</text>
  <text x="444" y="624" class="muted small">Card payment</text>
  <text x="664" y="611" class="body regular">−$16.72</text>
  <rect x="788" y="590" width="92" height="27" rx="13.5" fill="#f0f3f7"/>
  <text x="834" y="608" text-anchor="middle" class="body small" font-weight="600">Health</text>
  <text x="926" y="611" class="body regular">Everyday •• 2841</text>

  <!-- Dimmed background keeps the transaction list recognizable -->
  <rect x="248" y="76" width="1192" height="924" fill="#172b4d" opacity=".24"/>

  <!-- Compact drawer: a single-column layout with version tabs -->
  <g filter="url(#panel-shadow)">
    <rect x="864" y="0" width="576" height="1000" fill="#ffffff"/>
  </g>
  <path d="M864 0V1000" stroke="#e6ebf1"/>

  <!-- Minimal drawer header -->
  <rect x="864" y="0" width="576" height="78" fill="#ffffff"/>
  <path d="M864 78H1440" stroke="#edf0f4"/>
  <text x="904" y="47" class="ink medium">Transaction details</text>
  <rect x="1198" y="19" width="168" height="40" rx="9" fill="#ffffff" stroke="#d8e0e8"/>
  <path d="m1217 39 4 4 8-9" fill="none" stroke="#167d68" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1291" y="44" text-anchor="middle" class="body small" font-weight="600">Edit transaction</text>
  <circle cx="1405" cy="39" r="18" fill="#f4f6f8"/>
  <path d="m1400 34 10 10m0-10-10 10" stroke="#65758a" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Transaction identity -->
  <text x="904" y="125" class="muted tiny" font-weight="700" letter-spacing="1.1">CARD PAYMENT</text>
  <text x="904" y="160" class="ink" font-size="24" font-weight="700">Nordstrom Rack</text>
  <text x="904" y="186" class="muted small">14 Mar 2024  ·  Everyday •• 2841</text>
  <text x="1398" y="151" text-anchor="end" class="ink" font-size="22" font-weight="700">−$84.50</text>
  <text x="1398" y="173" text-anchor="end" class="muted small">USD</text>

  <!-- Version selector is compact and sits above the comparison -->
  <text x="904" y="223" class="muted tiny" font-weight="700" letter-spacing=".8">VERSION HISTORY</text>
  <text x="1398" y="223" text-anchor="end" class="muted tiny">3 versions</text>
  <rect x="904" y="238" width="494" height="45" rx="9" fill="#f3f5f7"/>
  <rect x="907" y="241" width="154" height="39" rx="7" fill="#ffffff" stroke="#e2e7ec"/>
  <text x="984" y="265" text-anchor="middle" class="body small" font-weight="600">Original</text>
  <text x="1133" y="265" text-anchor="middle" class="body small" font-weight="600">Version 2</text>
  <rect x="1238" y="241" width="157" height="39" rx="7" fill="#167d68"/>
  <text x="1316" y="265" text-anchor="middle" fill="#ffffff" class="small" font-weight="650">Version 3 · Current</text>
  <text x="904" y="304" class="muted tiny">Selected snapshot · 22 Mar 2024 at 10:42</text>

  <!-- Light comparison strip, not a second history panel -->
  <rect x="904" y="326" width="494" height="112" rx="12" fill="#f7faf9" stroke="#e3eee9"/>
  <text x="924" y="352" fill="#116653" class="tiny" font-weight="700" letter-spacing=".6">CHANGES SINCE VERSION 2</text>
  <text x="924" y="378" class="muted small">Category</text>
  <text x="1068" y="378" class="body small"><tspan fill="#718096">Groceries</tspan><tspan fill="#aab7c4">  →  </tspan><tspan fill="#116653" font-weight="700">Shopping</tspan></text>
  <text x="924" y="411" class="muted small">Description</text>
  <text x="1068" y="411" class="body small"><tspan fill="#718096">—</tspan><tspan fill="#aab7c4">  →  </tspan><tspan fill="#116653" font-weight="700">Clothing store</tspan></text>

  <!-- Single-column transaction data -->
  <text x="904" y="483" class="ink semibold">Transaction</text>
  <text x="904" y="518" class="muted small">Booking date</text>
  <text x="1398" y="518" text-anchor="end" class="body regular" font-weight="550">14 Mar 2024</text>
  <path d="M904 534H1398" stroke="#edf0f4"/>
  <text x="904" y="562" class="muted small">Value date</text>
  <text x="1398" y="562" text-anchor="end" class="body regular" font-weight="550">15 Mar 2024</text>
  <path d="M904 578H1398" stroke="#edf0f4"/>
  <text x="904" y="606" class="muted small">Counterparty</text>
  <text x="1398" y="606" text-anchor="end" class="body regular" font-weight="550">Nordstrom Rack</text>
  <path d="M904 622H1398" stroke="#edf0f4"/>
  <text x="904" y="650" class="muted small">Description</text>
  <text x="1398" y="650" text-anchor="end" class="body regular" font-weight="550">Clothing store</text>
  <path d="M904 666H1398" stroke="#edf0f4"/>

  <!-- Read-only category uses the same plain label/value treatment as other fields -->
  <text x="904" y="694" class="muted small">Category</text>
  <text x="1398" y="694" text-anchor="end" class="body regular" font-weight="550">Shopping</text>
  <path d="M904 710H1398" stroke="#edf0f4"/>
</svg>
