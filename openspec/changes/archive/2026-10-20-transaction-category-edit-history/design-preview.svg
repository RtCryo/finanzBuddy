<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
  <title id="title">Transaction category editing — redesigned side panel</title>
  <desc id="description">A transaction history screen with a compact right-side read-only detail panel, version tabs, and an explicit edit action.</desc>
  <defs>
    <filter id="panel-shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="-10" dy="0" stdDeviation="22" flood-color="#172b4d" flood-opacity="0.16"/>
    </filter>
    <filter id="menu-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172b4d" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ink { fill: #172b4d; }
      .body { fill: #344054; }
      .muted { fill: #718096; }
      .tiny { font-size: 11px; }
      .small { font-size: 12px; }
      .regular { font-size: 14px; }
      .medium { font-size: 15px; font-weight: 600; }
      .semibold { font-size: 18px; font-weight: 650; }
    </style>
  </defs>

  <!-- App shell behind the open transaction panel -->
