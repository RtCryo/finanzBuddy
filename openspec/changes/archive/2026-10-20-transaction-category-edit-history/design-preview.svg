  <text x="444" y="364" class="ink regular" font-weight="600">Nordstrom Rack</text>
  <text x="444" y="384" class="muted small">Card payment</text>
  <text x="664" y="371" fill="#b54747" class="regular" font-weight="600">−$84.50</text>
