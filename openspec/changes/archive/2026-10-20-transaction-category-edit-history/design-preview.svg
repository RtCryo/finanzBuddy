  <path d="M31 262h16M39 254v16" stroke="#7b8797" stroke-width="1.2"/>
  <text x="59" y="268" class="body regular">Reports</text>
  <path d="M0 928h248" stroke="#e8edf3"/>
  <circle cx="48" cy="966" r="18" fill="#e8eef5"/>
  <text x="48" y="970" text-anchor="middle" fill="#42566f" font-size="11" font-weight="700">AA</text>
  <text x="77" y="963" class="body small" font-weight="600">Alex Account</text>
  <text x="77" y="980" class="muted tiny">Personal workspace</text>

  <rect x="248" y="0" width="1192" height="76" fill="#ffffff"/>
