<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" fill="none">
  <defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#718096}.body{fill:#344054}.dark{fill:#172B4D}.small{font-size:12px}</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#172B4D" flood-opacity=".07"/></filter></defs>
  <rect width="1440" height="1000" fill="#F6F8FB"/><rect width="248" height="1000" fill="white"/><path d="M247.5 0V1000" stroke="#E8EDF3"/>
  <rect x="30" y="28" width="38" height="38" rx="12" fill="#167D68"/><path d="M40 49.5L47 56L59 40" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="53" font-size="20" font-weight="700" class="dark">finanz<tspan fill="#167D68">Buddy</tspan></text>
  <text x="28" y="117" font-size="12" font-weight="600" letter-spacing=".5" class="muted">WORKSPACE</text><rect x="16" y="137" width="216" height="46" rx="10" fill="white"/><rect x="32" y="151" width="18" height="18" rx="4" stroke="#7B8797" stroke-width="1.8"/><path d="M36 156H46M36 161H46M36 166H43" stroke="#7B8797" stroke-width="1.5" stroke-linecap="round"/><text x="62" y="166" font-size="14" font-weight="500" class="body">Documents</text>
  <rect x="16" y="192" width="216" height="46" rx="10" fill="#EAF5F1"/><rect x="33" y="207" width="17" height="17" rx="4" stroke="#167D68" stroke-width="1.7"/><path d="M41.5 210V221M36 215.5H47" stroke="#167D68" stroke-width="1.7" stroke-linecap="round"/><text x="62" y="221" font-size="14" font-weight="600" fill="#116653">Upload a file</text>
  <text x="292" y="57" font-size="13" class="muted">Workspace</text><path d="M365 48L369 52L365 56" stroke="#A0AAB8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="57" font-size="13" class="muted">Documents</text><path d="M451 48L455 52L451 56" stroke="#A0AAB8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="466" y="57" font-size="13" class="body">Upload</text>
  <circle cx="1361" cy="48" r="18" fill="white" stroke="#E5EAF0"/><path d="M1353 49C1353 44.6 1356.6 41 1361 41C1365.4 41 1369 44.6 1369 49V53L1371 56H1351L1353 53V49Z" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/><circle cx="1404" cy="48" r="18" fill="#E8EEF5"/><text x="1404" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#42566F">AM</text><line x1="278" y1="82" x2="1440" y2="82" stroke="#E8EDF3"/>
  <text x="292" y="145" font-size="30" font-weight="700" class="dark">Upload a document</text><text x="292" y="176" font-size="15" class="muted">Add a financial document to extract and organize its transactions.</text>
  <rect x="292" y="211" width="710" height="640" rx="14" fill="white" filter="url(#shadow)"/><text x="322" y="253" font-size="17" font-weight="650" class="dark">Choose a file</text><text x="322" y="276" font-size="12" class="muted">Select a statement from your device.</text>
  <rect x="322" y="302" width="650" height="220" rx="12" fill="#FAFCFD" stroke="#AFCFC4" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="647" cy="365" r="28" fill="#EAF5F1"/><path d="M647 377V353M638 362L647 353L656 362" stroke="#167D68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="647" y="420" text-anchor="middle" font-size="14" font-weight="600" class="dark">Drag and drop your file here</text><text x="647" y="445" text-anchor="middle" font-size="12" class="muted">or browse files on your device</text><rect x="576" y="466" width="142" height="38" rx="8" fill="white" stroke="#DCE3EB"/><text x="647" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#167D68">Browse files</text>
  <text x="322" y="564" font-size="12" class="muted">Supported formats: CSV, PDF, XML · Maximum file size: 20 MB</text>
  <text x="322" y="621" font-size="13" font-weight="600" class="body">Document type</text><rect x="322" y="635" width="650" height="48" rx="9" fill="white" stroke="#DCE3EB"/><text x="340" y="665" font-size="13" class="muted">Select document type</text><path d="M944 654L949 659L954 654" stroke="#7C8898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="711" width="18" height="18" rx="4" fill="#EAF5F1"/><path d="M327 720L331 724L337 716" stroke="#167D68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="725" font-size="12" class="body">I confirm this file contains my financial information.</text>
  <rect x="322" y="770" width="650" height="48" rx="9" fill="#167D68"/><text x="647" y="800" text-anchor="middle" font-size="14" font-weight="600" fill="white">Upload document</text>
  <rect x="1026" y="211" width="374" height="229" rx="14" fill="white" filter="url(#shadow)"/><circle cx="1064" cy="251" r="15" fill="#EAF5F1"/><path d="M1058 251L1062 255L1070 247" stroke="#167D68" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1090" y="255" font-size="15" font-weight="650" class="dark">What happens next?</text><text x="1050" y="297" font-size="12" class="body">1. Your file is securely uploaded.</text><text x="1050" y="328" font-size="12" class="body">2. We extract the transactions.</text><text x="1050" y="359" font-size="12" class="body">3. Review them in your document list.</text><line x1="1050" y1="385" x2="1376" y2="385" stroke="#EEF1F5"/><text x="1050" y="412" font-size="11" class="muted">You can track processing status at any time.</text>
  <rect x="1026" y="458" width="374" height="124" rx="14" fill="#EAF5F1"/><path d="M1051 493C1051 486 1057 480 1064 480C1071 480 1077 486 1077 493V501H1051V493Z" stroke="#167D68" stroke-width="1.6"/><rect x="1048" y="500" width="32" height="24" rx="5" stroke="#167D68" stroke-width="1.6"/><circle cx="1064" cy="511" r="2" fill="#167D68"/><text x="1094" y="494" font-size="13" font-weight="600" fill="#116653">Your documents stay private</text><text x="1094" y="517" font-size="11" fill="#4F756B">Files are only available to your account.</text><text x="1094" y="536" font-size="11" fill="#4F756B">We never share them with third parties.</text>
  <text x="292" y="963" font-size="11" class="muted">Your financial data is secure and only accessible to you.</text>
</svg>
