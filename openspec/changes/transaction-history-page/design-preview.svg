<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" fill="none">
  <defs>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .ink{fill:#172B4D}.body{fill:#344054}.muted{fill:#718096}.green{fill:#167D68}.small{font-size:12px}.label{font-size:10px;font-weight:650;letter-spacing:.055em}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#172B4D" flood-opacity=".06"/></filter>
  </defs>

  <!-- Workspace shell -->
  <rect width="1440" height="1000" fill="#F6F8FB"/>
  <rect width="248" height="1000" fill="#FFFFFF"/>
  <path d="M247.5 0V1000" stroke="#E8EDF3"/>
  <rect x="30" y="28" width="38" height="38" rx="12" fill="#167D68"/>
  <path d="m40 48 6 6 12-14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="53" font-size="20" font-weight="700" class="ink">finanz<tspan class="green">Buddy</tspan></text>
  <text x="28" y="117" font-size="11" font-weight="650" letter-spacing=".08em" class="muted">WORKSPACE</text>
  <rect x="16" y="137" width="216" height="46" rx="10" fill="#FFFFFF"/>
  <rect x="33" y="151" width="17" height="18" rx="3.5" stroke="#7B8797" stroke-width="1.6"/>
  <path d="M37 156h9M37 160.5h9M37 165h6" stroke="#7B8797" stroke-width="1.4" stroke-linecap="round"/>
  <text x="62" y="166" font-size="13" font-weight="500" class="body">Documents</text>
  <rect x="16" y="189" width="216" height="46" rx="10" fill="#EAF5F1"/>
  <rect x="33" y="202" width="17" height="19" rx="3.5" stroke="#167D68" stroke-width="1.6"/>
  <path d="M37 207h9M37 211.5h9M37 216h6" stroke="#167D68" stroke-width="1.4" stroke-linecap="round"/>
  <text x="62" y="218" font-size="13" font-weight="650" fill="#116653">Transactions</text>
  <text x="28" y="955" font-size="10" class="muted">Your financial data is secure</text>
  <text x="28" y="971" font-size="10" class="muted">and only accessible to you.</text>

  <!-- Top bar -->
  <rect x="248" width="1192" height="82" fill="#F6F8FB" fill-opacity=".96"/>
  <path d="M248 81.5H1440" stroke="#E8EDF3"/>
  <text x="292" y="49" font-size="12" class="muted">Workspace</text>
  <path d="m369 43 5 5-5 5" stroke="#A0AAB8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="388" y="49" font-size="12" class="body">Transactions</text>
  <circle cx="1344" cy="41" r="17" fill="#E8EEF5"/>
  <text x="1344" y="45" text-anchor="middle" font-size="10" font-weight="700" fill="#42566F">AM</text>
  <text x="1370" y="45" font-size="11" class="body">alex@example.com</text>

  <!-- Heading -->
  <text x="292" y="145" font-size="28" font-weight="700" letter-spacing="-.6" class="ink">All transactions</text>
  <text x="292" y="174" font-size="13" class="muted">A single view of transactions across your processed statements.</text>
  <!-- Filter panel -->
  <rect x="292" y="204" width="1108" height="150" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="316" y="232" font-size="14" font-weight="650" class="ink">Filter transactions</text>
  <text x="316" y="266" class="label muted">SEARCH</text>
  <rect x="316" y="276" width="300" height="42" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <circle cx="335" cy="296" r="5.5" stroke="#8B97A7" stroke-width="1.4"/>
  <path d="m339 300 4 4" stroke="#8B97A7" stroke-width="1.4" stroke-linecap="round"/>
  <text x="352" y="300" font-size="11" class="body">market</text>
  <text x="316" y="336" font-size="9" class="muted">Description or counterparty</text>

  <text x="638" y="266" class="label muted">BOOKING DATE FROM</text>
  <rect x="638" y="276" width="166" height="42" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <text x="652" y="301" font-size="11" class="body">01 Aug 2026</text>
  <rect x="778" y="289" width="13" height="13" rx="2" stroke="#718096" stroke-width="1.2"/>
  <path d="M781 286v5m7-5v5m-10 2h13" stroke="#718096" stroke-width="1.2" stroke-linecap="round"/>

  <text x="826" y="266" class="label muted">BOOKING DATE TO</text>
  <rect x="826" y="276" width="166" height="42" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <text x="840" y="301" font-size="11" class="body">31 Aug 2026</text>
  <rect x="966" y="289" width="13" height="13" rx="2" stroke="#718096" stroke-width="1.2"/>
  <path d="M969 286v5m7-5v5m-10 2h13" stroke="#718096" stroke-width="1.2" stroke-linecap="round"/>

  <text x="1014" y="266" class="label muted">CATEGORY</text>
  <rect x="1014" y="276" width="206" height="42" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <text x="1028" y="301" font-size="11" class="body">Groceries</text>
  <path d="m1194 293 5 5 5-5" stroke="#718096" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1236" y="276" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <path d="m1255 291 12 12m0-12-12 12" stroke="#167D68" stroke-width="1.4" stroke-linecap="round"/>
  <text x="1276" y="301" font-size="11" font-weight="600" class="green">Clear filters</text>
  <rect x="316" y="328" width="88" height="19" rx="9.5" fill="#EAF5F1"/>
  <text x="330" y="341" font-size="9" font-weight="600" fill="#116653">3 filters active</text>

  <!-- Results card -->
  <rect x="292" y="378" width="1108" height="500" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="316" y="415" font-size="16" font-weight="650" class="ink">Transaction history</text>
  <text x="316" y="439" font-size="11" class="muted">218 matching transactions across 4 statements</text>
  <!-- Table header -->
  <rect x="292" y="460" width="1108" height="42" fill="#F8FAFC"/>
  <text x="316" y="486" class="label muted">BOOKING DATE</text>
  <text x="425" y="486" class="label muted">VALUE DATE</text>
  <text x="532" y="486" class="label muted">AMOUNT</text>
  <text x="648" y="486" class="label muted">COUNTERPARTY</text>
  <text x="810" y="486" class="label muted">DESCRIPTION</text>
  <text x="1008" y="486" class="label muted">CATEGORY</text>
  <text x="1160" y="486" class="label muted">SOURCE FILE</text>

  <!-- Transaction rows -->
  <g font-size="10.5">
    <text x="316" y="534" class="body">31 Aug 2026</text><text x="425" y="534" class="body">31 Aug 2026</text><text x="532" y="534" font-weight="650" fill="#A53030">−€42.80</text><text x="648" y="534" font-weight="600" class="ink">Green Market</text><text x="810" y="534" class="body">Groceries and household items</text><rect x="1008" y="516" width="83" height="23" rx="11.5" fill="#F1F4F8"/><text x="1049.5" y="531" text-anchor="middle" font-size="9.5" class="body">Groceries</text><text x="1160" y="534" class="green">Aug_statement.csv ↗</text>
    <path d="M316 554H1376" stroke="#EEF1F5"/>
    <text x="316" y="586" class="body">28 Aug 2026</text><text x="425" y="586" class="body">28 Aug 2026</text><text x="532" y="586" font-weight="650" fill="#A53030">−€18.25</text><text x="648" y="586" font-weight="600" class="ink">Green Market</text><text x="810" y="586" class="body">Fresh produce</text><rect x="1008" y="568" width="83" height="23" rx="11.5" fill="#F1F4F8"/><text x="1049.5" y="583" text-anchor="middle" font-size="9.5" class="body">Groceries</text><text x="1160" y="586" class="green">Card_export.csv ↗</text>
    <path d="M316 606H1376" stroke="#EEF1F5"/>
    <text x="316" y="638" class="body">24 Aug 2026</text><text x="425" y="638" class="body">25 Aug 2026</text><text x="532" y="638" font-weight="650" fill="#A53030">−€63.10</text><text x="648" y="638" font-weight="600" class="ink">Green Market</text><text x="810" y="638" class="body">Weekly grocery shop</text><rect x="1008" y="620" width="83" height="23" rx="11.5" fill="#F1F4F8"/><text x="1049.5" y="635" text-anchor="middle" font-size="9.5" class="body">Groceries</text><text x="1160" y="638" class="green">Aug_statement.csv ↗</text>
    <path d="M316 658H1376" stroke="#EEF1F5"/>
    <text x="316" y="690" class="body">19 Aug 2026</text><text x="425" y="690" class="body">19 Aug 2026</text><text x="532" y="690" font-weight="650" fill="#A53030">−€11.49</text><text x="648" y="690" font-weight="600" class="ink">Market Corner</text><text x="810" y="690" class="body">Bakery and snacks</text><rect x="1008" y="672" width="83" height="23" rx="11.5" fill="#F1F4F8"/><text x="1049.5" y="687" text-anchor="middle" font-size="9.5" class="body">Groceries</text><text x="1160" y="690" class="green">July_bank.csv ↗</text>
    <path d="M316 710H1376" stroke="#EEF1F5"/>
    <text x="316" y="742" class="body">07 Aug 2026</text><text x="425" y="742" class="body">07 Aug 2026</text><text x="532" y="742" font-weight="650" fill="#A53030">−€35.72</text><text x="648" y="742" font-weight="600" class="ink">Green Market</text><text x="810" y="742" class="body">Household supplies</text><rect x="1008" y="724" width="83" height="23" rx="11.5" fill="#F1F4F8"/><text x="1049.5" y="739" text-anchor="middle" font-size="9.5" class="body">Groceries</text><text x="1160" y="742" class="green">Aug_statement.csv ↗</text>
  </g>

  <!-- Pagination -->
  <path d="M292 790H1400" stroke="#EEF1F5"/>
  <text x="316" y="826" font-size="10.5" class="muted">Showing 16–20 of 218 matching transactions</text>
  <rect x="1052" y="807" width="30" height="34" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <path d="m1071 818-5 6 5 6" stroke="#167D68" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1088" y="807" width="30" height="34" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <text x="1103" y="828" text-anchor="middle" font-size="10" class="body">1</text>
  <text x="1132" y="828" text-anchor="middle" font-size="12" class="muted">…</text>
  <rect x="1148" y="807" width="30" height="34" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <text x="1163" y="828" text-anchor="middle" font-size="10" class="body">3</text>
  <rect x="1184" y="807" width="30" height="34" rx="8" fill="#167D68"/>
  <text x="1199" y="828" text-anchor="middle" font-size="10" font-weight="650" fill="#FFFFFF">4</text>
  <rect x="1220" y="807" width="30" height="34" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <text x="1235" y="828" text-anchor="middle" font-size="10" class="body">5</text>
  <text x="1264" y="828" text-anchor="middle" font-size="12" class="muted">…</text>
  <rect x="1280" y="807" width="30" height="34" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <text x="1295" y="828" text-anchor="middle" font-size="10" class="body">44</text>
  <rect x="1316" y="807" width="30" height="34" rx="8" fill="#FFFFFF" stroke="#DCE3EB"/>
  <path d="m1328 818 5 6-5 6" stroke="#167D68" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="292" y="932" font-size="10" class="muted">Design concept · Desktop layout · 1440 px</text>
  <text x="292" y="958" font-size="10" class="muted">Your financial data is secure and only accessible to you.</text>
</svg>
