# Local-development overrides, loaded automatically by `docker compose`.
# Builds the application components from the working tree and tags them
# finanzbuddy-<component>:dev, so a local build never shadows a released image.
# Restores direct localhost host ports for the application and infrastructure
# services so they can be reached from the host during development. The
# production deployment intentionally omits this file (see README), so those
# services stay on the internal Docker network and only Traefik is published.
services:
  postgres:
    ports:
      - "5432:5432"

  kafka:
    ports:
      - "29092:29092"

  minio:
    ports:
      # SeaweedFS S3 gateway. (The old MinIO console on 9001 no longer exists.)
      - "9000:9000"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: finanzbuddy-api-gateway:dev
    ports:
      - "8080:8080"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: finanzbuddy-ui:dev
    ports:
      - "3000:80"

  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    image: finanzbuddy-parser-service:dev
