name: PR title

# Squash merge uses the pull-request title as the commit message on main, so the title
# must follow Conventional Commits. The workflow checks out no code, which makes
# pull_request_target safe here.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull-request title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
