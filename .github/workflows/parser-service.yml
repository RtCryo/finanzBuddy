name: Parser Service CI

on:
  push:
    branches: [main, '02-parser-service']
    paths:
      - 'parser-service/**'
      - '.github/workflows/parser-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'parser-service/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: parser-service

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: mvn -B compile

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check code style
        run: mvn -B spotless:check

  test:
    name: Test with JaCoCo
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn -B test

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report-${{ github.run_id }}
          path: parser-service/target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: parser-service/target/site/jacoco/jacoco.xml
          flags: parser-service
          name: parser-service-coverage
          fail_ci_if_error: false
