services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzbuddy-postgres
    environment:
      POSTGRES_DB: finanzbuddy
      POSTGRES_USER: finanzbuddy
      POSTGRES_PASSWORD: finanzbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finanzbuddy -d finanzbuddy" ]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.10
    container_name: finanzbuddy-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: finanzbuddy-kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: finanzbuddy-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: finanzbuddy-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finanzbuddy
      DB_USER: finanzbuddy
      DB_PASSWORD: finanzbuddy
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finanzbuddy-documents
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    container_name: finanzbuddy-parser-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
      api-gateway:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finanzbuddy
      DB_USER: finanzbuddy
      DB_PASSWORD: finanzbuddy
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finanzbuddy-documents
      GATEWAY_BASE_URL: http://api-gateway:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PARSER_FORMAT_CSV: "true"
      PARSER_FORMAT_PDF: "false"
      PARSER_FORMAT_XML: "false"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: finanzbuddy-ui
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "3000:80"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  postgres-data:
  minio-data:
