services:
  traefik:
    image: traefik:v3.7.13
    container_name: finanzbuddy-traefik
    profiles:
      - production
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    depends_on:
      ui:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    container_name: finanzbuddy-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: finanzbuddy-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    # S3-compatible object storage. Replaced the unmaintained bitnamilegacy/minio image with
    # SeaweedFS (Apache-2.0, actively maintained). The service keeps the "minio" name and MINIO_*
    # env vars so the api-gateway/parser-service S3 client (io.minio) works unchanged. The S3
    # gateway is bound to port 9000 to preserve MINIO_ENDPOINT. Credentials are injected from the
    # MINIO_ROOT_* env vars into the SeaweedFS -s3.config identities file at startup; buckets are
    # created on demand (the api-gateway creates its bucket at startup via the S3 API).
    image: chrislusf/seaweedfs:3.99
    container_name: finanzbuddy-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"finanzbuddy","credentials":[{"accessKey":"$${MINIO_ROOT_USER}","secretKey":"$${MINIO_ROOT_PASSWORD}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed -logtostderr=true server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    volumes:
      - minio-data:/data
    healthcheck:
      # Use 127.0.0.1 (not localhost): the S3 server listens on IPv4 only, and busybox wget
      # resolves localhost to ::1 first, which refuses the connection.
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9000/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: finanzbuddy-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: finanzbuddy-documents
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    container_name: finanzbuddy-parser-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      api-gateway:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: finanzbuddy-documents
      GATEWAY_BASE_URL: http://api-gateway:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PARSER_FORMAT_CSV: "true"
      PARSER_FORMAT_PDF: "false"
      PARSER_FORMAT_XML: "false"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: finanzbuddy-ui
    depends_on:
      api-gateway:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.ui.loadbalancer.server.port=80"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  postgres-data:
  minio-data:
  traefik-acme:
